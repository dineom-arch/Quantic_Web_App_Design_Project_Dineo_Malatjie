name: CI
on: [push, pull_request]
jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cafefausse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cafefausse"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          python -m pip install -r "04 Backend Code/backend/requirements.txt"

      - name: Run backend migrations and seed
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/cafefausse
          PYTHONPATH: "04 Backend Code/backend"
        run: |
          python "04 Backend Code/backend/scripts/create_db.py"
          python "04 Backend Code/backend/manage.py" db_migrate -m "ci"
          python "04 Backend Code/backend/manage.py" db_upgrade
          python "04 Backend Code/backend/scripts/seed.py"

      - name: Run backend tests
        env:
          PYTHONPATH: "04 Backend Code/backend"
        run: |
          python -m pip install pytest
          pytest -q "04 Backend Code/backend/tests"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend deps
        run: |
          cd "03 Frontend Code/frontend"
          npm ci

      - name: Run frontend tests
        run: |
          cd "03 Frontend Code/frontend"
          npm run test --silent
